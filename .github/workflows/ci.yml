name: CI

# Test senza GPU: sidecar (logica, sicurezza, coda, scontorno) su Linux e
# Windows, e scene Godot in headless. La generazione vera ha bisogno di
# ComfyUI e di una GPU, e resta una prova manuale.

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  sidecar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow numpy scipy
      # Tutti i test girano anche se uno fallisce, e chi fallisce lascia le
      # ultime righe in un'annotazione: i log di GitHub si leggono solo da
      # autenticati, le annotazioni no.
      - name: Test del sidecar
        shell: bash
        run: |
          falliti=""
          for t in test_parametri test_scontorno test_rapporto test_coda test_gpu test_sicurezza; do
            echo "== $t"
            if python sidecar/$t.py > esito.txt 2>&1; then
              cat esito.txt
            else
              cat esito.txt
              echo "::error title=$t::$(tail -n 8 esito.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
              falliti="$falliti $t"
            fi
          done
          if [ -n "$falliti" ]; then echo "Falliti:$falliti"; exit 1; fi

  godot:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.6.1
    steps:
      - uses: actions/checkout@v5
      - name: Scarica Godot
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot-bin
      - name: Importa il progetto
        run: ./godot-bin --headless --path godot --import
      - name: Prova delle scene
        run: ./godot-bin --headless --path godot --script res://test_scene.gd
